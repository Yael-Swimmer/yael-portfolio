<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Icon Set — Final</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1600px; height: 900px;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  }

  /* ── BG ─────────────────────────── */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 80% at 50% 46%, rgba(10,132,255,0.04) 0%, transparent 65%),
      #000;
  }

  /* ── HEADER ─────────────────────── */
  .header {
    position: absolute;
    top: 52px; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
  }

  .header-eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
  }

  .header-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: rgba(255,255,255,0.9);
  }

  /* ── ICON GRID ──────────────────── */
  .icon-grid {
    position: absolute;
    top: 168px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 18px;
    padding: 0 80px;
  }

  /* Each column = one icon concept */
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    flex: 1;
    max-width: 186px;
  }

  .col-name {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: rgba(255,255,255,0.45);
    text-align: center;
    line-height: 1.35;
  }

  /* ── ICON SIZES ROW ─────────────── */
  .sizes-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }

  /* Large icon on dark tile */
  .tile-lg {
    width: 80px; height: 80px;
    border-radius: 22px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: center;
  }

  /* Medium icon – naked */
  .tile-md {
    display: flex; align-items: center; justify-content: center;
  }

  /* Small icons row */
  .small-row {
    display: flex; align-items: center; gap: 10px;
  }

  .tile-sm {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: center;
  }

  /* size labels */
  .size-labels {
    display: flex;
    align-items: center;
    gap: 0;
    width: 100%;
  }

  .sz {
    font-size: 8.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.12);
    text-align: center;
    flex: 1;
  }

  /* ── DIVIDER LINE ───────────────── */
  .col-divider {
    width: 1px;
    align-self: stretch;
    background: rgba(255,255,255,0.05);
    margin-top: 4px;
    flex-shrink: 0;
  }

  /* ── FOOTER ─────────────────────── */
  .footer {
    position: absolute;
    bottom: 40px; left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.1);
  }

  svg { display: block; overflow: visible; }
</style>
</head>
